name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-amd64:
    name: Validate amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Dart dependencies
        run: flutter pub get

      - name: Verify generated sources
        run: bash build/scripts/verify-generated-sources.sh

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # 特权 helper 的纯逻辑单测（NDJSON 协议、白名单 argv、串行状态机），
      # 独立于 Flutter 测试运行（docs/47 §13.1 第 3 步）。
      - name: Run privileged helper unit tests
        run: bash build/scripts/test-privileged-helper.sh

      # 构建 release bundle 并断言 helper 随产物分发且不依赖 Flutter/GTK、
      # 无 RPATH（docs/47 §13.2 打包检查；DEB/RPM/AppImage 均整体复制 bundle）。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Verify privileged helper artifact
        run: |
          flutter build linux --release
          bash build/scripts/verify-privileged-helper-artifact.sh

      # Packaging smoke tests moved to nightly to keep PR feedback fast.
      - name: Run release CLI smoke test
        run: bash build/scripts/release-cli-smoke-test.sh

      - name: Run nightly CLI smoke test
        run: bash build/scripts/nightly-cli-smoke-test.sh
