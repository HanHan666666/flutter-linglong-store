# 本文件是 Gitee Go 流水线的权威配置，由 Gitee Go 在保存流水线时规范化写入。
# 手工编辑时的注意事项：
#   1. triggers.trigger 必须保持 manual：本流水线会真实提交到商店，
#      一旦被 push/tag 自动触发，会把未验证的产物送进商店；
#   2. variables.global 中的条目是流水线关联的通用变量，删掉会导致构建时取不到凭据；
#   3. 通过 Gitee Go 界面保存会重写本文件并去除注释，因此设计说明统一维护在
#      docs/53-uos-store-gitee-go-design.md，不要在本文件里写长注释。
version: "1.0"
name: uos-store-upload
displayName: 统信商店投递
stages:
- name: 投递
  displayName: 投递
  strategy: naturally
  trigger: auto
  steps:
  - step: execute@docker
    name: uos-store-submit
    displayName: 提交到统信应用商店
    certificate: ""
    image: docker.m.daocloud.io/library/python:3.12-slim
    command:
    - export MODE="submit"
    - bash build/scripts/uos-store-submit.sh
triggers:
  trigger: manual
notify: []
variables:
  global:
  - APPSTORE_USERNAME
  - APPSTORE_PASSWORD
